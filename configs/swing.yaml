  outputs_dir: outputs/swing/outputs
  reports_dir: outputs/swing/reports
  feature_panel_path: outputs/swing/features/swing_feature_panel.parquet
  data_audit_report_path: outputs/swing/data_audit_report.md
  schema_summary_path: outputs/swing/schema_summary.csv
  data_inventory_path: outputs/swing/file_inventory.csv

data:
  discovery_roots:
    - .
    - analysis_outputs
  preferred_dataset_dir: analysis_outputs/russell3000_full_dataset
  smoke_dataset_path: analysis_outputs/r3000_smoke_parallel_full_1_v2/russell3000_indicator_dataset.pkl
